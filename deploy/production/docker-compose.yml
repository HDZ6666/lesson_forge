name: lesson-forge

services:
  mysql:
    image: mysql:8.0.46
    container_name: lesson-forge-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-lesson_forge}
      MYSQL_USER: ${MYSQL_USER:-lesson_forge}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --max-connections=200
      - --max-allowed-packet=64M
    volumes:
      - mysql_data:/var/lib/mysql
      - ../../service/sql/ruoyi-fastapi.sql:/docker-entrypoint-initdb.d/001-ruoyi-fastapi.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - lesson_forge

  redis:
    image: redis:7-alpine
    container_name: lesson-forge-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      TZ: Asia/Shanghai
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping 2>/dev/null | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks:
      - lesson_forge

  collector:
    build:
      context: ../../collector
      dockerfile: ../deploy/production/collector.Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-uncommitted}
    image: lesson-forge-collector:${SOURCE_REVISION:-production}
    container_name: lesson-forge-collector
    init: true
    stop_grace_period: 90s
    restart: unless-stopped
    environment:
      COLLECTOR_API_HOST: 0.0.0.0
      COLLECTOR_API_PORT: 9110
      COLLECTOR_API_TOKEN: ${COLLECTOR_API_TOKEN:?COLLECTOR_API_TOKEN is required}
      COLLECTOR_DB: /data/zujuan.sqlite3
      COLLECTOR_DATA_DIR: /data/zujuan
      COLLECTOR_PROFILE_DIR: /profile
      COLLECTOR_HEADFUL: "false"
      # 初期单本低负载；实际额度由部署配置决定。
      COLLECTOR_LIST_CONCURRENCY: ${COLLECTOR_LIST_CONCURRENCY:-1}
      COLLECTOR_ASSET_CONCURRENCY: ${COLLECTOR_ASSET_CONCURRENCY:-2}
      COLLECTOR_DELAY_MIN_MS: ${COLLECTOR_DELAY_MIN_MS:-4000}
      COLLECTOR_DELAY_MAX_MS: ${COLLECTOR_DELAY_MAX_MS:-6000}
      COLLECTOR_SOURCE_DAILY_REQUEST_LIMIT: ${COLLECTOR_SOURCE_DAILY_REQUEST_LIMIT:-0}
      COLLECTOR_SOURCE_DAILY_BOOK_LIMIT: ${COLLECTOR_SOURCE_DAILY_BOOK_LIMIT:-0}
      COLLECTOR_SOURCE_DAILY_ACTIVE_SECONDS: ${COLLECTOR_SOURCE_DAILY_ACTIVE_SECONDS:-0}
      COLLECTOR_SOURCE_DAILY_DOWNLOAD_MIB: ${COLLECTOR_SOURCE_DAILY_DOWNLOAD_MIB:-0}
      COLLECTOR_MIN_DISK_FREE_MIB: ${COLLECTOR_MIN_DISK_FREE_MIB:-0}
      COLLECTOR_MIN_MEMORY_FREE_MIB: ${COLLECTOR_MIN_MEMORY_FREE_MIB:-0}
      # 采集子进程内存上限（MB）：超过即停止并封存为可续采，避免再次拖垮 3.7GB 的宿主机（COL-015）。
      COLLECTOR_CHILD_MAX_RSS_MB: "1536"
      TZ: Asia/Shanghai
    volumes:
      - collector_data:/data
      - collector_profile:/profile
    shm_size: 512m
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9110/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks:
      - lesson_forge

  service:
    build:
      context: ../../service
      dockerfile: ../deploy/production/service.Dockerfile
      args:
        SOURCE_REVISION: ${SOURCE_REVISION:-uncommitted}
    image: lesson-forge-service:${SOURCE_REVISION:-production}
    container_name: lesson-forge-service
    restart: unless-stopped
    environment:
      APP_ENV: prod
      APP_NAME: 教案生成系统
      APP_ROOT_PATH: /docker-api
      APP_HOST: 0.0.0.0
      APP_PORT: 9099
      APP_VERSION: 1.0.0
      APP_RELEASE_ID: ${APP_RELEASE_ID:-production}
      APP_RELOAD: "false"
      APP_WORKERS: 1
      APP_IP_LOCATION_QUERY: "false"
      APP_SAME_TIME_LOGIN: "true"
      APP_DEMO_MODE: "false"
      APP_DISABLE_SWAGGER: "true"
      APP_DISABLE_REDOC: "true"
      APP_DEFAULT_ENABLED_PLUGINS: bank,lesson
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY is required}
      DB_DEFAULT_SOURCE: primary
      DB_SOURCES: >-
        {"primary":{"db_type":"mysql","db_host":"mysql","db_port":3306,"db_username":"${MYSQL_USER:-lesson_forge}","db_password":"${MYSQL_PASSWORD}","db_database":"${MYSQL_DATABASE:-lesson_forge}","db_echo":false,"db_connect_timeout":10,"db_max_overflow":10,"db_pool_size":20,"db_pool_recycle":3600,"db_pool_timeout":30,"db_required":true}}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: ""
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_DATABASE: 2
      LOG_MASK_ENABLED: "true"
      LOGURU_LEVEL: INFO
      LOGURU_STDOUT: "true"
      LOG_FILE_ENABLED: "true"
      SERVICE_STORAGE_ROOT: /app/runtime/vf_admin
      SERVICE_CACHE_ROOT: /app/runtime/caches
      SERVICE_LOG_ROOT: /app/runtime/logs
      BANK_COLLECTOR_URL: http://collector:9110
      BANK_COLLECTOR_TOKEN: ${COLLECTOR_API_TOKEN}
      BANK_COLLECTOR_TIMEOUT_SECONDS: 30
      BANK_ASSET_ROOT: /app/runtime/bank
      BANK_AUTOMATIC_SYNC_ENABLED: ${BANK_AUTOMATIC_SYNC_ENABLED:-0}
      LESSON_UNDO_MINUTES: ${LESSON_UNDO_MINUTES:-30}
      BANK_MIN_DISK_FREE_MIB: ${BANK_MIN_DISK_FREE_MIB:-0}
      BANK_MIN_MEMORY_FREE_MIB: ${BANK_MIN_MEMORY_FREE_MIB:-0}
      BANK_SYNC_MAX_PENDING_IMPORTS: ${BANK_SYNC_MAX_PENDING_IMPORTS:-0}
      TRANSPORT_CRYPTO_ENABLED: "false"
      TRANSPORT_CRYPTO_MODE: off
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      collector:
        condition: service_healthy
    volumes:
      - service_runtime:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.create_connection(('127.0.0.1',9099),3); s.close()"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks:
      - lesson_forge

  nginx:
    image: nginx:1.27-alpine
    container_name: lesson-forge-nginx
    restart: unless-stopped
    depends_on:
      service:
        condition: service_healthy
    ports:
      - "127.0.0.1:${HTTP_PORT:-18080}:80"
    volumes:
      - ../../pc/dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - lesson_forge

volumes:
  mysql_data:
    name: lesson-forge-mysql-data
  redis_data:
    name: lesson-forge-redis-data
  collector_data:
    name: lesson-forge-collector-data
  collector_profile:
    name: lesson-forge-collector-profile
  service_runtime:
    name: lesson-forge-service-runtime

networks:
  lesson_forge:
    name: lesson-forge-network
